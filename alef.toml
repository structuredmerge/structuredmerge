[workspace]
alef_version = "0.89.0"
languages = ["ruby", "python"]

[workspace.ownership]
user_owned = [
  "rustfmt.toml",
  # Frozen review evidence, owned by check_typed_api_baselines.py --record.
  # Never regenerate these alongside the live API: that would erase drift.
  "contracts/typed-api/python/snapshot/**",
  "contracts/typed-api/ruby/snapshot/**",
  # Retained legacy regression inputs, not active generation/publication targets.
  # Keep exact paths so new typed-core outputs cannot inherit an exclusion.
  "packages/ruby/ext/structuredmerge_host_prototype_core_rb/native/Cargo.toml",
  "packages/ruby/ext/structuredmerge_host_prototype_core_rb/native/extconf.rb",
  "packages/ruby/ext/structuredmerge_host_prototype_core_rb/src/lib.rs",
  "packages/ruby/lib/structuredmerge_host_prototype.rb",
  "packages/ruby/lib/structuredmerge_host_prototype/native.rb",
  "packages/ruby/lib/structuredmerge_host_prototype/version.rb",
  "packages/ruby/structuredmerge_host_prototype.gemspec",
]

[workspace.scaffold]
description = "Typed polyglot StructuredMerge kernel"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"
repository = "https://github.com/structuredmerge/structuredmerge"
authors = ["Peter Boling"]

[workspace.scaffold.cargo.env]
RUST_MIN_STACK = "16777216"

[workspace.scaffold.cargo.targets]
aarch64_unknown_linux_gnu = false
x86_64_unknown_linux_musl = false
wasm32_unknown_unknown = false

[[crates]]
name = "structuredmerge-core"
sources = [
  "crates/structuredmerge-core/src/lib.rs",
  "crates/structuredmerge-core/src/host.rs",
  "crates/structuredmerge-core/src/workflow.rs",
  "crates/ast-merge/src/provider_registry.rs",
  "crates/ast-merge/src/provider_selection.rs",
  "crates/structuredmerge-core/src/merge.rs",
  "crates/structuredmerge-core/src/diff.rs",
  "crates/structuredmerge-core/src/operations.rs",
  "crates/structuredmerge-core/src/operation.rs",
  "crates/structuredmerge-core/src/operation_result.rs",
  "crates/structuredmerge-core/src/portable_diagnostic.rs",
  "crates/structuredmerge-core/src/portable_conflict.rs",
  "crates/ast-merge/src/owner_diff.rs",
  "crates/structuredmerge-core/src/edits.rs",
  "crates/structuredmerge-core/src/structural.rs",
  "crates/structuredmerge-core/src/templates.rs",
  "crates/ast-template/src/lib.rs",
  "crates/ast-crispr/src/lib.rs",
  "crates/structuredmerge-core/src/profiles.rs",
  "crates/structuredmerge-core/src/capabilities.rs",
  "crates/tree-haver/src/lib.rs",
  "crates/tree-haver/src/source.rs",
  "crates/tree-haver/src/parsed.rs",
  "crates/tree-haver/src/service.rs",
  "crates/ast-merge/src/lib.rs",
  "crates/ast-merge/src/source_render.rs",
]
version_from = "crates/structuredmerge-core/Cargo.toml"
core_import = "structuredmerge_core"
error_type = "CoreError"
error_constructor = "structuredmerge_core::CoreError::new({msg})"

[crates.ruby]
gem_name = "structuredmerge-core"
scaffold_output = "packages/ruby"

[crates.ruby.stubs]
output = "packages/ruby/sig"

[crates.python]
send_sync_types = ["OperationControl"]
# Input and result DTOs share these identities; do not shadow them with
# facade dataclasses that native SourceInput constructors cannot accept.
reexported_types = ["SourceDescriptor", "LineEndings", "TemplateDestinationContext", "ParseRequest", "ParseOptions", "MergeProviderDescriptor", "MergeParserRequirements"]
pip_name = "structuredmerge-core"
module_name = "_native"
scaffold_output = "packages/python"

[crates.python.stubs]
output = "packages/python/structuredmerge_core"

[crates.output]
ruby = "packages/ruby/ext/structuredmerge_core_rb/src/"
python = "crates/structuredmerge-core-py/src/"

[[crates.trait_bridges]]
trait_name = "ParserHost"
type_alias = "ParserHost"
param_name = "host"

[[crates.trait_bridges]]
trait_name = "WorkflowHost"
type_alias = "WorkflowHost"
param_name = "host"

[crates.include]
types = [
  "OperationKind", "OperationRequest", "OperationSource", "OperationPolicy",
  "AnalyzePolicy", "DiffPolicy", "DirectionalMergePolicy", "ThreeWayMergePolicy",
  "MergeProviderSelection", "OperationParserSelection", "OperationResult",
  "ResultProvider", "ResultParserSelection", "ResultProfile", "ResultRange", "ResultPoint", "ResultSpan",
  "ResultSourceRegion", "ResultDiagnostic", "ResultChange", "ResultConflict", "PreservationProperty",
  "ResultVerification", "ResultDiff", "ResultAnalysis",
  "PortableCategory", "DiagnosticLayer", "DiagnosticOrigin", "DiagnosticSourceRef", "DiagnosticSubjectRef",
  "PortableDiagnostic", "DiagnosticRecord", "ConflictCategory", "AlternativeState", "LocalizationStatus",
