[workspace]
alef_version = "0.89.0"
languages = ["ruby", "python"]

[workspace.ownership]
user_owned = ["rustfmt.toml"]

[workspace.scaffold]
description = "Typed polyglot StructuredMerge kernel"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"
repository = "https://github.com/structuredmerge/structuredmerge"
authors = ["Peter Boling"]

[workspace.scaffold.cargo.env]
RUST_MIN_STACK = "16777216"

[workspace.scaffold.cargo.targets]
aarch64_unknown_linux_gnu = false
x86_64_unknown_linux_musl = false
wasm32_unknown_unknown = false

[[crates]]
name = "structuredmerge-core"
sources = [
  "crates/structuredmerge-core/src/lib.rs",
  "crates/structuredmerge-core/src/host.rs",
  "crates/structuredmerge-core/src/merge.rs",
  "crates/structuredmerge-core/src/edits.rs",
  "crates/structuredmerge-core/src/structural.rs",
  "crates/structuredmerge-core/src/templates.rs",
  "crates/ast-template/src/lib.rs",
  "crates/ast-crispr/src/lib.rs",
  "crates/structuredmerge-core/src/profiles.rs",
  "crates/tree-haver/src/lib.rs",
  "crates/tree-haver/src/source.rs",
  "crates/tree-haver/src/parsed.rs",
  "crates/tree-haver/src/service.rs",
  "crates/ast-merge/src/lib.rs",
  "crates/ast-merge/src/source_render.rs",
]
version_from = "crates/structuredmerge-core/Cargo.toml"
core_import = "structuredmerge_core"
error_type = "CoreError"
error_constructor = "structuredmerge_core::CoreError::new({msg})"

[crates.ruby]
gem_name = "structuredmerge-core"
scaffold_output = "packages/ruby"

[crates.ruby.stubs]
output = "packages/ruby/sig"

[crates.python]
send_sync_types = ["OperationControl"]
# Input and result DTOs share these identities; do not shadow them with
# facade dataclasses that native SourceInput constructors cannot accept.
reexported_types = ["SourceDescriptor", "LineEndings", "TemplateDestinationContext"]
pip_name = "structuredmerge-core"
module_name = "_native"
scaffold_output = "packages/python"

[crates.python.stubs]
output = "packages/python/structuredmerge_core"

[crates.output]
ruby = "packages/ruby/ext/structuredmerge_core_rb/src/"
python = "crates/structuredmerge-core-py/src/"

[[crates.trait_bridges]]
trait_name = "ParserHost"
type_alias = "ParserHost"
param_name = "host"

[crates.include]
types = [
  "TemplateSessionOptions", "TemplateSessionRequestReport", "TemplateProfileRequest",
  "DirectorySessionMode", "DirectorySessionProfile", "SessionDiagnostic", "TemplateSessionPlanReport",
  "TemplateDestinationContext", "TemplateTokenConfig", "TemplateStrategy", "TemplateStrategyOverride",
  "TemplateDirectoryRunnerReport", "TemplateDirectoryPlanReport", "TemplateDirectoryPlanReportEntry",
  "TemplateDirectoryPlanReportSummary", "TemplateDirectoryPlanStatus", "TemplateExecutionAction",
  "TemplatePreviewResult", "TemplateTreeRunReport", "TemplateTreeRunReportEntry",
  "TemplateTreeRunReportSummary", "TemplateTreeRunStatus", "TemplateDirectoryApplyReport",
  "TemplateDirectoryApplyReportEntry", "TemplateDirectoryApplyReportSummary",
  "CrisprBoundaryRelationships", "CrisprBoundaryImplementation", "CrisprBoundaryMetadata", "CrisprBoundaryReport",
  "CrisprLimitOperator", "CrisprLimitConstraint", "CrisprLimitReport", "CrisprLimitRequest",
  "CrisprMatchRequest", "CrisprMatchReport", "CrisprSelectionRequest", "CrisprSelectionReport",
  "CrisprDestinationRequest", "CrisprDestinationReport",
  "CrisprOperationRequest", "CrisprOperationReport", "CrisprBatchOperationReport",
  "ExplicitSourceEdit", "SourceEditRequest", "SourceEditLimits", "SourceEditResult",
  "OperationControl",
  "NativeMergeProfile",
  "NativeMergeResult", "NativeAnalysisRejection", "RetainedSourceSegment", "ThreeWayMergeOutcome", "Diagnostic", "DiagnosticCategory",
  "DiagnosticSeverity", "ReviewDiagnosticDetail", "ReviewDiagnosticReason", "ReviewDecisionAction",
  "MergeConflict", "ConflictAlternative", "ConflictAlternativeState", "OwnedSourceRegion",
  "SourceRevision", "PolicyReference", "PolicySurface",
  "CoreError", "ParserFailure", "ParserHost", "CoreParseResult", "ParseLimits",
  "ParseBatchRequest", "ParseBatchResult", "ProbeBatchRequest", "ProbeBatchResult",
  "ParserSelection", "ParserProviderDescriptor", "ParserProbeRequest", "ParserProbeResult",
  "ParseOptions", "ParseRequest", "ParserCandidate", "SelectionReport",
  "SourceRole", "SourceEncoding", "LineEndings", "SourceDescriptor", "SourceInput",
  "ByteRange", "SourcePoint", "SourceSpan", "NodeRole",
  "NativeExtension", "ChildEdge", "ParseNode", "ParseSeverity", "ParseDiagnostic",
  "AttachmentHint", "ParseComment", "ParseOutput",
]
functions = ["report_template_options", "report_template_profile", "plan_template_directory", "report_structural_boundary", "report_structural_limit", "report_structural_match", "report_structural_selection", "report_structural_destination", "report_structural_operations", "apply_explicit_source_edits", "native_merge_profiles", "create_operation_control", "parse_sources", "parse_sources_controlled", "register_parser_host", "unregister_parser_host", "merge_yaml_mapping", "merge_yaml_mapping_controlled", "merge_python_declarations", "merge_python_declarations_controlled"]

[crates.exclude]
methods = ["ByteRange.contains_range", "ByteRange.overlaps", "OwnedSourceRegion.validate"]

[crates.e2e]
fixtures = "../fixtures/polyglot/typed-core"
output = "e2e"
languages = ["ruby", "python"]

[crates.e2e.packages.ruby]
name = "structuredmerge-core"

[crates.e2e.call]
function = "native_merge_profiles"
module = "structuredmerge_core"
returns_result = false
result_is_vec = true

[crates.e2e.call.overrides.python]
module = "native_merge_fixture"

[crates.e2e.call.overrides.ruby]
module = "./native_merge_fixture"

[crates.e2e.calls.yaml_native_merge]
function = "run_yaml_native_merge"
module = "structuredmerge_core"
skip_languages = ["python"]
args = [
  { name = "base", field = "input.base", type = "string" },
  { name = "ours", field = "input.ours", type = "string" },
  { name = "theirs", field = "input.theirs", type = "string" },
]

[crates.e2e.calls.python_native_merge]
function = "run_python_native_merge"
module = "native_merge_fixture"
skip_languages = ["ruby"]
args = [
  { name = "base", field = "input.base", type = "string" },
  { name = "ours", field = "input.ours", type = "string" },
  { name = "theirs", field = "input.theirs", type = "string" },
]
