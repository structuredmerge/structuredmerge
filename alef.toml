  "CrisprOperationRequest", "CrisprOperationReport", "CrisprBatchOperationReport",
  "ExplicitSourceEdit", "SourceEditRequest", "SourceEditLimits", "SourceEditResult",
  "OperationControl",
  "WorkflowHost", "WorkflowOperation", "WorkflowBatchRequest", "PreparedWorkflowOperation",
  "PreparedWorkflowBatch", "WorkflowBatchResult", "WorkflowLimits", "WorkflowExecutionOwner", "WorkflowExecution",
  "MergeParserRequirements", "MergeProviderDescriptor", "MergeProviderInventory", "MergeProviderRole",
  "MergeSelectionRequest", "MergeSelectionCandidate", "MergeSelectionReport",
  "NativeMergeProfile", "OperationProfileCatalog", "OperationProfileDeclaration",
  "CapabilityQuery", "CapabilityObservation", "CapabilityManifest",
  "NativeMergeResult", "NativeAnalysisRejection", "RetainedSourceSegment", "ThreeWayMergeOutcome", "Diagnostic", "DiagnosticCategory",
  "DiagnosticSeverity", "ReviewDiagnosticDetail", "ReviewDiagnosticReason", "ReviewDecisionAction",
  "MergeConflict", "ConflictAlternative", "ConflictAlternativeState", "OwnedSourceRegion",
  "SourceRevision", "PolicyReference", "PolicySurface",
  "CoreError", "ParserFailure", "ParserHost", "CoreParseResult", "ParseLimits", "ParserRegistryInventory", "ParserSelectionRequest",
  "ParseBatchRequest", "ParseBatchResult", "ProbeBatchRequest", "ProbeBatchResult",
  "ParserSelection", "ParserProviderDescriptor", "ParserProbeRequest", "ParserProbeResult",
  "ParseOptions", "ParseRequest", "ParserCandidate", "SelectionReport",
  "SourceRole", "SourceEncoding", "LineEndings", "SourceDescriptor", "SourceInput",
  "ByteRange", "SourcePoint", "SourceSpan", "NodeRole",
  "NativeExtension", "ChildEdge", "ParseNode", "ParseSeverity", "ParseDiagnostic",
  "AttachmentHint", "ParseComment", "ParseOutput",
]
functions = ["register_workflow_host", "replace_workflow_host", "unregister_workflow_host", "workflow_registry_inventory", "execute_workflow_batch", "execute_workflow_batch_controlled", "execute_operation", "execute_operation_controlled", "diff_native_owners", "diff_native_owners_controlled", "report_template_options", "report_template_profile", "plan_template_directory", "report_structural_boundary", "report_structural_limit", "report_structural_match", "report_structural_selection", "report_structural_destination", "report_structural_operations", "apply_explicit_source_edits", "native_merge_profiles", "operation_profile_catalog", "capability_manifest", "capability_manifest_controlled", "create_operation_control", "parse_sources", "parse_sources_controlled", "register_parser_host", "replace_parser_host", "parser_registry_inventory", "parser_selection_report", "parser_selection_report_controlled", "unregister_parser_host", "register_language_pack_parser", "register_cached_language_pack_parser", "unregister_parser_provider", "merge_yaml_mapping", "merge_yaml_mapping_controlled", "merge_python_declarations", "merge_python_declarations_controlled"]

[crates.exclude]
types = ["ValidatedOperationRequest", "ConflictEvidence", "ResolutionAuthorization", "ConflictValidationContext",
  "SourceDocument", "SourceMap", "ParserProvider", "ExecutionContext", "ParserRegistrySnapshot",
  "ResultContractError", "DiagnosticContractError", "ConflictContractError", "OperationRequestError", "OperationRequestErrorCode"]
methods = ["ByteRange.contains_range", "ByteRange.overlaps", "OwnedSourceRegion.validate",
  "MergeSelectionRequest.validate",
  "OperationRequest.validate", "OperationResult.validate_against", "OperationResult.validate_with_conflict_evidence",
  "OperationKind.source_roles", "OperationPolicy.kind", "OperationPolicy.fallback_policy",
  "DiagnosticRecord.id", "DiagnosticRecord.blocking", "ConflictRecord.id", "ConflictRecord.unresolved", "ConflictRecord.matches_path"]

[crates.e2e]
fixtures = "../fixtures/polyglot/typed-core"
output = "e2e"
languages = ["ruby", "python"]

[crates.e2e.packages.ruby]
name = "structuredmerge-core"

[crates.e2e.call]
function = "native_merge_profiles"
module = "structuredmerge_core"
returns_result = false
result_is_vec = true

[crates.e2e.call.overrides.python]
module = "native_merge_fixture"

[crates.e2e.call.overrides.ruby]
module = "./native_merge_fixture"

[crates.e2e.calls.capability_manifest]
function = "run_capability_manifest"
module = "native_merge_fixture"
args = [
  { name = "profile", field = "input.profile", type = "string" },
  { name = "operation", field = "input.operation", type = "string" },
  { name = "dialect", field = "input.dialect", type = "string" },
