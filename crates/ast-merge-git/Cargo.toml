[package]
name = "ast-merge-git"
version = "0.2.0"
repository = "https://github.com/structuredmerge/structuredmerge"
homepage = "https://structuredmerge.org"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Git merge contracts for Structured Merge"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
ast-merge = { version = "0.2.0", path = "../ast-merge" }
json-merge = { version = "0.2.0", path = "../json-merge" }
tree-haver = { version = "0.2.0", path = "../tree-haver" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lib]
path = "src/lib.rs"
