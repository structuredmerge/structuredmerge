[package]
name = "typescript-merge"
version = "0.2.1"
repository = "https://github.com/structuredmerge/structuredmerge"
homepage = "https://structuredmerge.org"
authors = ["Peter H. Boling"]
edition = "2024"
description = "TypeScript syntax merge helpers for Structured Merge"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
ast-merge = { version = "0.2.1", path = "../ast-merge" }
oxc_allocator = "0.110"
oxc_ast = "0.110"
oxc_parser = "0.110"
oxc_span = "0.110"
serde = { version = "1.0", features = ["derive"] }
tree-haver = { version = "0.2.1", path = "../tree-haver" }

[dev-dependencies]
serde_json = "1"
