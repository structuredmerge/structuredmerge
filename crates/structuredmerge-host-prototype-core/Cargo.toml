[package]
name = "structuredmerge-host-prototype-core"
version = "0.2.0"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Experimental host-provider bridge core for StructuredMerge"
homepage = "https://structuredmerge.org"
repository = "https://github.com/structuredmerge/structuredmerge-rust"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"
publish = false

[dependencies]
async-trait = "0.1"
go-merge = { version = "0.2.0", path = "../go-merge" }
parking_lot = "0.12"
json-merge = { version = "0.2.0", path = "../json-merge" }
rust-merge = { version = "0.2.0", path = "../rust-merge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
tree-haver = { version = "0.2.0", path = "../tree-haver" }

[lib]
path = "src/lib.rs"
