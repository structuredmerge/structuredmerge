[package]
name = "structuredmerge-core"
version = "0.2.0"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Typed facade for the StructuredMerge kernel"
homepage = "https://structuredmerge.org"
repository = "https://github.com/structuredmerge/structuredmerge"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
bash-merge = { version = "0.2.0", path = "../bash-merge" }
go-merge = { version = "0.2.0", path = "../go-merge" }
ast-merge-git = { version = "0.2.0", path = "../ast-merge-git" }
json-merge = { version = "0.2.0", path = "../json-merge" }
ast-template = { version = "0.2.0", path = "../ast-template" }
ast-crispr = { version = "0.2.0", path = "../ast-crispr" }
python-merge = { version = "0.2.0", path = "../python-merge" }
ast-merge = { version = "0.2.0", path = "../ast-merge" }
yaml-merge = { version = "0.2.0", path = "../yaml-merge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-haver = { version = "0.2.0", path = "../tree-haver" }

[lib]
path = "src/lib.rs"
