[package]
name = "ingest_observation"
version = "0.2.1"
edition = "2024"
publish = false

[[bin]]
name = "ingest-observation-verify"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
