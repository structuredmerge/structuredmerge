[package]
name = "ingest_observation"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ingest-observation-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
