[package]
name = "rust-merge"
version = "0.2.1"
repository = "https://github.com/structuredmerge/structuredmerge"
homepage = "https://structuredmerge.org"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Rust syntax merge helpers for Structured Merge"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
ast-merge = { version = "0.2.1", path = "../ast-merge" }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2", features = ["full"] }
tree-haver = { version = "0.2.1", path = "../tree-haver" }

[dev-dependencies]
serde_json = "1"
