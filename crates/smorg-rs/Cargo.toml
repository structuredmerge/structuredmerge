[package]
name = "smorg-rs"
version = "0.2.0"
repository = "https://github.com/structuredmerge/structuredmerge-rust"
homepage = "https://structuredmerge.org"
authors = ["Peter H. Boling"]
edition = "2024"
description = "Implementation-specific StructuredMerge command for Rust"
license = "AGPL-3.0-only OR PolyForm-Small-Business-1.0.0"

[dependencies]
ast-merge = { version = "0.2.0", path = "../ast-merge" }
ast-merge-git = { version = "0.2.0", path = "../ast-merge-git" }
base64 = "0.22"
go-merge = { version = "0.2.0", path = "../go-merge" }
json-merge = { version = "0.2.0", path = "../json-merge" }
plain-merge = { version = "0.2.0", path = "../plain-merge" }
rbs-merge = { version = "0.2.0", path = "../rbs-merge" }
ruby-merge = { version = "0.2.0", path = "../ruby-merge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml-merge = { package = "structuredmerge-toml-merge", version = "0.2.0", path = "../toml-merge" }
yaml-merge = { version = "0.2.0", path = "../yaml-merge" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "smorg-rs"
path = "src/main.rs"
