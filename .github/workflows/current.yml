name: Current

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "*-stable"
    tags:
      - "!*" # Do not execute on tags
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clone sibling fixtures repo
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/structuredmerge/structuredmerge-fixtures ../fixtures
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Run checks
        run: mise run check

  ruby-bindings:
    name: Ruby bindings (${{ matrix.platform }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "3.2"
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "4.0"
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
            ruby: "4.0"
          - platform: arm64-darwin
            runner: macos-14
            ruby: "4.0"
          - platform: x86_64-darwin
            runner: macos-15-intel
            ruby: "4.0"
          - platform: x64-mingw-ucrt
            runner: windows-2025
            ruby: "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - name: Test generated Ruby bindings
        run: bundle exec rake spec
        working-directory: packages/ruby
      - name: Verify Ruby API and native ABI contract
        run: bundle exec ruby ../../workspace-scripts/check_ruby_api.rb
        working-directory: packages/ruby

  ruby-package:
    name: Ruby platform package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout TreeHaver consumer fixture
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: structuredmerge/structuredmerge-ruby
          ref: 680e6de509186ec7b845cfa8644b33a9f16a6766
          path: structuredmerge-ruby
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: packages/ruby
      - name: Install Alef
        shell: bash
        run: |
          cargo install --git https://github.com/structuredmerge/alef.git \
            --rev "$(cat workspace-scripts/alef-source-revision)" --locked
      - name: Build platform gem and provenance
        run: mise run ruby-package
      - name: Measure packaged cold paths
        run: mise run ruby-cold-paths
      - name: Install packaged gem in isolation
        shell: bash
        run: |
          gem_home="$(mktemp -d)"
          (
            cd structuredmerge-ruby/gems/tree_haver
            SKIP_GEM_SIGNING=true gem build tree_haver.gemspec \
              --output "$GITHUB_WORKSPACE/tree_haver-consumer.gem"
          )
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" \
            gem install dist/*.gem --install-dir "$gem_home" --no-document
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" \
            gem install tree_haver-consumer.gem --install-dir "$gem_home" --no-document
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" \
            STRUCTUREDMERGE_API_USE_INSTALLED=true \
            ruby workspace-scripts/check_ruby_api.rb
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" \
            ruby workspace-scripts/check_ruby_normalized_parser.rb
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" \
            ruby workspace-scripts/check_tree_haver_consumer.rb
      - name: Upload platform gem and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: structuredmerge-host-prototype-x86_64-linux
          path: |
            dist/*.gem
            dist/*.provenance.json
            dist/*.cold-path.json
          if-no-files-found: error

  alef:
    name: Alef generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alef
        shell: bash
        run: |
          cargo install --git https://github.com/structuredmerge/alef.git \
            --rev "$(cat workspace-scripts/alef-source-revision)" --locked
      - name: Verify generated bindings
        run: alef verify --exit-code
      - name: Reproduce generated tree twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            alef all --clean --skip-compile --skip-snippet-validation
            changes="$(git status --porcelain --untracked-files=all -- \
              .alef-generation.toml .alef-ownership.toml packages/ruby docs/reference)"
            if [[ -n "$changes" ]]; then
              printf 'Alef generation pass %s changed the committed tree:\n%s\n' "$pass" "$changes" >&2
              exit 1
            fi
          done
      - name: Validate publish manifests
        run: alef publish validate
