name: Current

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "*-stable"
    tags:
      - "!*" # Do not execute on tags
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  installed-kernel-cli:
    name: Installed kernel CLI real-Git gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TREE_HAVER_LANGUAGE_PACK_CACHE_DIR: ${{ github.workspace }}/tmp/typed-tslp-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout canonical Git fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: structuredmerge/structuredmerge-fixtures
          ref: 93276c5a54fe6fb6bd3cc0c44aa63880fc9a0a19
          path: shared-fixtures
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install both kernel executables from this checkout
        shell: bash
        run: |
          mkdir -p tmp
          export TMPDIR="$PWD/tmp"
          cargo install --path crates/smorg-rs --root "$PWD/tmp/cli-install" --debug --locked
      - name: Verify installed canonical executable through real Git
        run: >-
          python workspace-scripts/check_installed_cli_git.py tmp/cli-install/bin/smorg
          --fixtures shared-fixtures/diagnostics/slice-951-git-driver-json-integration/git-driver-json-integration.json
      - name: Verify installed compatibility alias through real Git
        if: ${{ !cancelled() }}
        run: >-
          python workspace-scripts/check_installed_cli_git.py tmp/cli-install/bin/smorg-rs
          --fixtures shared-fixtures/diagnostics/slice-951-git-driver-json-integration/git-driver-json-integration.json
      - name: Retain Git gate evidence even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-kernel-cli-git-linux
          include-hidden-files: true
          path: |
            tmp/installed-cli-git-*/report.json
            tmp/installed-cli-git-*/**/.git/driver-report.json
            tmp/installed-cli-git-*/**/.git/merge-stdout
            tmp/installed-cli-git-*/**/.git/merge-stderr
          if-no-files-found: warn

  typed-core-python-artifact:
    name: Typed core Python installed artifact (${{ matrix.platform }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      STRUCTUREDMERGE_NATIVE_PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            python: "3.10"
          - platform: linux-x64
            runner: ubuntu-latest
            python: "3.14"
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: "3.14"
          - platform: macos-arm64
            runner: macos-14
            python: "3.14"
          - platform: macos-x64
            runner: macos-15-intel
            python: "3.14"
          - platform: windows-x64
            runner: windows-2025
            python: "3.14"
          - platform: windows-arm64
            runner: windows-11-arm
            python: "3.14"
    steps:
      - name: Preserve reviewed source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared wheel build backend and native parser
        run: python -m pip install 'maturin>=1,<2' 'libcst==1.9.0'
      - name: Verify common operation execution with native LibCST
        run: cargo test -p structuredmerge-core --test native_operations --locked python_ -- --ignored
      - name: Verify archive audit rejects invalid artifacts
        # Tooling audits include POSIX CLI and Ruby workflow checks; installed
        # Python runtime/generated tests below still run on every target.
        if: matrix.platform == 'linux-x64'
        run: python -m unittest discover -s workspace-scripts/tests -v
      - name: Verify typed Ruby and Python API review baselines
        run: python workspace-scripts/check_typed_api_baselines.py
      - name: Check typed publication dependency closure
        run: python workspace-scripts/check_typed_release_inventory.py
      - name: Build checked-in generated core binding
        run: python -m maturin build --locked --out ../../tmp/core-wheels --profile dev
        working-directory: packages/python
      - name: Verify wheel contents and isolated installed native merges
        run: python workspace-scripts/check_core_python_artifact.py tmp/core-wheels

  typed-core-ruby-artifact:
    name: Typed core installed artifact (${{ matrix.platform }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "3.2"
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "4.0"
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
            ruby: "4.0"
          - platform: arm64-darwin
            runner: macos-14
            ruby: "4.0"
          - platform: x86_64-darwin
            runner: macos-15-intel
            ruby: "4.0"
          - platform: x64-mingw-ucrt
            runner: windows-2025
            ruby: "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Match typed extension to RubyInstaller ABI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'RUST_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - name: Compile checked-in generated core binding
        run: bundle exec rake compile
        working-directory: packages/ruby
      - name: Build isolated core artifact and test installed native merges
        run: bundle exec ruby ../../workspace-scripts/check_core_ruby_artifact.rb
        working-directory: packages/ruby

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout shared fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: structuredmerge/structuredmerge-fixtures
          ref: 93276c5a54fe6fb6bd3cc0c44aa63880fc9a0a19
          path: shared-fixtures
      - name: Place fixtures beside kernel
        shell: bash
        run: mv shared-fixtures ../fixtures
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Run checks
        run: mise run check
      - name: Verify typed Rust language-pack parser service
        env:
          TREE_HAVER_LANGUAGE_PACK_CACHE_DIR: ${{ github.workspace }}/tmp/typed-tslp-cache
        run: mise exec -- cargo test -p tree-haver --test language_pack_provider --locked -- --include-ignored
      - name: Setup Ruby for native parser integration
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Verify native Psych facts drive Rust merge decisions
        run: mise exec -- cargo test -p yaml-merge --test typed_psych_merge --locked -- --ignored
      - name: Verify common operation execution with native Psych
        run: mise exec -- cargo test -p structuredmerge-core --test native_operations --locked -- --ignored --skip python_

  ruby-bindings:
    name: Legacy checkout regressions (${{ matrix.platform }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "3.2"
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: "4.0"
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
            ruby: "4.0"
          - platform: arm64-darwin
            runner: macos-14
            ruby: "4.0"
          - platform: x86_64-darwin
            runner: macos-15-intel
            ruby: "4.0"
          - platform: x64-mingw-ucrt
            runner: windows-2025
            ruby: "4.0"
    steps:
      - name: Enable long fixture paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout shared fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: structuredmerge/structuredmerge-fixtures
          ref: 93276c5a54fe6fb6bd3cc0c44aa63880fc9a0a19
          path: shared-fixtures
      - name: Place fixtures beside kernel
        shell: bash
        run: mv shared-fixtures ../fixtures
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Match RubyInstaller ABI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'RUST_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - name: Build retained legacy regression boundary (not a package)
        run: bundle exec ruby ../../workspace-scripts/build_legacy_ruby_regression.rb
        working-directory: packages/ruby
      - name: Test core and retained checkout regressions
        run: bundle exec rake spec
        working-directory: packages/ruby
      - name: Verify Ruby API and native ABI contract
        run: bundle exec ruby ../../workspace-scripts/check_ruby_api.rb
        working-directory: packages/ruby

  ruby-package:
    name: Typed core Ruby export (not publication)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: packages/ruby
      - name: Compile committed generated core binding
        run: bundle exec rake compile
        working-directory: packages/ruby
      - name: Export allowlisted current-ABI core artifact
        run: bundle exec ruby ../../workspace-scripts/check_core_ruby_artifact.rb --package-only ../../tmp/core-artifacts
        working-directory: packages/ruby
      - name: Verify export metadata and integrity before upload
        shell: bash
        run: |
          ruby workspace-scripts/verify_core_ruby_export.rb \
            tmp/core-artifacts/*.gem tmp/core-artifacts/core-ruby-artifact.json
      - name: Upload development core export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: structuredmerge-core-development-x86_64-linux
          path: |
            tmp/core-artifacts/*.gem
            tmp/core-artifacts/core-ruby-artifact.json
            workspace-scripts/verify_core_ruby_export.rb
          if-no-files-found: error

  alef:
    name: Alef generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Alef
        shell: bash
        run: |
          cargo install alef --version "=$(cat workspace-scripts/alef-version)" --locked
      - name: Verify generated bindings
        run: alef verify --exit-code
      - name: Reproduce generated tree twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            alef all --clean --skip-compile --skip-snippet-validation
            changes="$(git status --porcelain --untracked-files=all -- \
              .alef-generation.toml .alef-ownership.toml packages/ruby docs/reference)"
            if [[ -n "$changes" ]]; then
              printf 'Alef generation pass %s changed the committed tree:\n%s\n' "$pass" "$changes" >&2
              exit 1
            fi
          done
      - name: Validate publish manifests
        run: alef publish validate
