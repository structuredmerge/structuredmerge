name: Publish

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated 0.2.1 dependency closure and release artifacts
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to validate/publish (for example v0.2.1)
        required: false
        default: v0.2.1
        type: string
      dry_run:
        description: Build and validate release artifacts without publishing
        required: false
        default: true
        type: boolean
      force_republish:
        description: Republish targets even when the exact version is already present
        required: false
        default: false
        type: boolean
      targets:
        description: Comma-separated targets (empty means all enabled targets)
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [publish-release]

concurrency:
  group: structuredmerge-publish-${{ inputs.release_tag || github.event.release.tag_name || github.event.client_payload.tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      publish_enabled: ${{ steps.publish.outputs.enabled }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1
        with:
          available-targets: "crates,python,ruby"
          alef-version: "0.94.0"
          targets: ${{ inputs.targets || github.event.client_payload.targets || '' }}
          tag: ${{ inputs.release_tag || github.event.release.tag_name || github.event.client_payload.tag || '' }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          force-republish: ${{ inputs.force_republish || 'false' }}

      - name: Resolve checkout ref
        id: ref
        env:
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          TAG: ${{ steps.meta.outputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "checkout_ref=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve publication authorization
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish || 'false' }}
          DISPATCH_PUBLISH: ${{ github.event.client_payload.publish || 'false' }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
        run: |
          enabled=false
          if [[ "${DRY_RUN}" != "true" ]] && {
            [[ "${INPUT_PUBLISH}" == "true" ]] ||
            [[ "${EVENT_NAME}" == "release" ]] ||
            [[ "${EVENT_NAME}" == "repository_dispatch" && "${DISPATCH_PUBLISH}" == "true" ]]
          }; then
            enabled=true
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Write release configuration summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGETS: ${{ steps.meta.outputs.release_targets }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          FORCE_REPUBLISH: ${{ steps.meta.outputs.force_republish }}
          PUBLISH_ENABLED: ${{ steps.publish.outputs.enabled }}
        run: |
          {
            echo "## Release configuration"
            echo "- Tag: ${TAG}"
            echo "- Version: ${VERSION}"
            echo "- Targets: ${TARGETS}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Force republish: ${FORCE_REPUBLISH}"
            echo "- Publication enabled: ${PUBLISH_ENABLED}"
          } >> "$GITHUB_STEP_SUMMARY"

  check-registries:
    name: Check registries
    needs: prepare
    uses: xberg-io/actions/.github/workflows/reusable-check-registries.yml@v1
    with:
      version: ${{ needs.prepare.outputs.version }}
      registries: |
        [
          {
            "name": "cratesio",
            "registry": "cratesio",
            "package": "structuredmerge-core"
          },
          {
            "name": "pypi",
            "registry": "pypi",
            "package": "structuredmerge-core"
          },
          {
            "name": "rubygems",
            "registry": "rubygems",
            "package": "structuredmerge-core"
          }
        ]

  validate:
    name: Validate release inputs
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Checkout canonical fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: structuredmerge/structuredmerge-fixtures
          ref: be4bf25d59bceac6a4adcc27dea081a2bab4c798
          path: shared-fixtures
      - name: Place fixtures beside kernel
        shell: bash
        run: mv shared-fixtures ../fixtures
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Setup Ruby
        uses: appraisal-rb/setup-ruby-flash@4ee08a66f0a60f7bb129d5d0e997042f935d1904 # v2.5
        with:
          ruby-version: "4.0"
      - name: Install Alef
        run: cargo install alef --version "=$(cat workspace-scripts/alef-version)" --locked
      - name: Verify generated bindings and package metadata
        run: |
          alef verify --exit-code
          alef publish validate
          python workspace-scripts/check_typed_release_inventory.py
          python -m unittest workspace-scripts/tests/test_release_manifests.py -v
      - name: Run workspace tests
        run: cargo test --workspace

  build-python-wheels:
    name: Build Python wheel (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.release_python == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-14
          - label: macos-x86_64
            runner: macos-15-intel
          - label: windows-x86_64
            runner: windows-2025
          - label: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Preserve reviewed source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install --disable-pip-version-check 'maturin>=1,<2'
      - name: Build wheel
        working-directory: packages/python
        shell: bash
        run: python -m maturin build --release --out ../../dist
        env:
          PROJECT_ROOT: ${{ github.workspace }}
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-python-sdist:
    name: Build Python source distribution
    needs: prepare
    if: needs.prepare.outputs.release_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Build source distribution
        uses: xberg-io/actions/build-python-sdist@v1
        with:
          package-dir: packages/python
          output-dir: dist
          alef-version: "0.94.0"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-python:
    name: Publish Python package
    needs: [prepare, check-registries, build-python-wheels, build-python-sdist]
    if: >-
      ${{
        (needs.prepare.outputs.publish_enabled == 'true' ||
          needs.prepare.outputs.dry_run == 'true') &&
        needs.prepare.outputs.release_python == 'true' &&
        needs.build-python-wheels.result == 'success' &&
        needs.build-python-sdist.result == 'success' &&
        (needs.prepare.outputs.dry_run == 'true' ||
          fromJson(needs.check-registries.outputs.results).pypi != 'true' ||
          needs.prepare.outputs.force_republish == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - name: Download source distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdist
          path: dist
      - name: Publish to PyPI
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          expected-version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  verify-ruby-platform-gems:
    name: Verify Ruby platform gem (${{ matrix.label }}, Ruby ${{ matrix.ruby }})
    needs: prepare
    if: needs.prepare.outputs.release_ruby == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-linux
            runner: ubuntu-latest
            ruby: "3.2"
          - label: x86_64-linux
            runner: ubuntu-latest
            ruby: "4.0"
          - label: aarch64-linux
            runner: ubuntu-24.04-arm
            ruby: "4.0"
          - label: arm64-darwin
            runner: macos-14
            ruby: "4.0"
          - label: x86_64-darwin
            runner: macos-15-intel
            ruby: "4.0"
          - label: x64-mingw-ucrt
            runner: windows-2025
            ruby: "4.0"
    steps:
      - name: Preserve reviewed source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Match typed extension to RubyInstaller ABI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-gnu
          echo 'RUST_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
          echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-gnu' >> "$GITHUB_ENV"
      - name: Setup Ruby
        uses: appraisal-rb/setup-ruby-flash@4ee08a66f0a60f7bb129d5d0e997042f935d1904 # v2.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - name: Compile checked-in generated core binding
        run: bundle exec rake compile
        working-directory: packages/ruby
      - name: Export verified platform gem
        run: bundle exec ruby ../../workspace-scripts/check_core_ruby_artifact.rb --package-only ../../tmp/core-artifacts
        working-directory: packages/ruby
      - name: Upload platform gem and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-platform-${{ matrix.label }}-ruby-${{ matrix.ruby }}
          path: |
            tmp/core-artifacts/*.gem
            tmp/core-artifacts/core-ruby-artifact.json
          if-no-files-found: error
          retention-days: 14

  build-ruby-source:
    name: Build Ruby source gem
    needs: [prepare, publish-rust]
    if: >-
      ${{
        needs.prepare.outputs.release_ruby == 'true' &&
        needs.publish-rust.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: ""
          use-sccache: "false"
          install-llvm-cov: "false"
      - name: Install Alef
        uses: xberg-io/actions/install-alef@v1
        with:
          version: "0.94.0"
      - name: Setup Ruby
        uses: appraisal-rb/setup-ruby-flash@4ee08a66f0a60f7bb129d5d0e997042f935d1904 # v2.5
        with:
          ruby-version: "4.0"
          bundler: none
          bundler-cache: false
      - name: Prepare source gem from released Rust dependencies
        run: |
          mkdir -p tmp/core-ruby-source
          ruby workspace-scripts/prepare_core_ruby_source.rb \
            --alef "$(command -v alef)" \
            --output tmp/core-ruby-source
      - name: Upload Ruby source gem and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: rubygems-source
          path: |
            tmp/core-ruby-source/*.gem
            tmp/core-ruby-source/core-ruby-source.json
          if-no-files-found: error
          retention-days: 14

  publish-ruby:
    name: Publish RubyGems source package
    needs: [prepare, check-registries, build-ruby-source]
    if: >-
      ${{
        (needs.prepare.outputs.publish_enabled == 'true' ||
          needs.prepare.outputs.dry_run == 'true') &&
        needs.prepare.outputs.release_ruby == 'true' &&
        needs.build-ruby-source.result == 'success' &&
        (needs.prepare.outputs.dry_run == 'true' ||
          fromJson(needs.check-registries.outputs.results).rubygems != 'true' ||
          needs.prepare.outputs.force_republish == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Ruby source gem
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rubygems-source
          path: dist
      - name: Publish to RubyGems
        uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          expected-version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  release-binaries:
    name: Build release CLI artifact (${{ matrix.platform }})
    needs: [prepare, validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release executables
        shell: bash
        run: cargo build --release -p smorg --target "${{ matrix.target }}"
      - name: Verify release CLI gates
        shell: bash
        env:
          TARGET_DIR: target/${{ matrix.target }}/release
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          suffix = ".exe" if os.name == "nt" else ""
          root = Path(os.environ["TARGET_DIR"])
          for name in ("smorg", "smorg-rs"):
              executable = root / f"{name}{suffix}"
              if not executable.is_file() or executable.stat().st_size > 134217728:
                  raise SystemExit(f"invalid release executable: {executable}")
              subprocess.run([str(executable), "--version"], check=True)
          PY
      - name: Package deterministic release archive
        shell: bash
        env:
          TARGET_DIR: target/${{ matrix.target }}/release
        run: |
          version="${{ needs.prepare.outputs.version }}"
          version="${version#v}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          python workspace-scripts/package_release_archive.py \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --binary-dir "$TARGET_DIR" \
            --output-dir tmp/release-assets
          archive="$(find tmp/release-assets -maxdepth 1 -type f -name 'smorg-*' -print -quit)"
          python workspace-scripts/validate_release_archive.py "$archive" \
            --version "$version" \
            --platform "${{ matrix.platform }}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smorg-${{ needs.prepare.outputs.tag }}-${{ matrix.platform }}
          path: tmp/release-assets/smorg-*
          if-no-files-found: error

  assemble-release-evidence:
    name: Assemble release manifests and provenance
    needs: [prepare, release-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download all platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: smorg-${{ needs.prepare.outputs.tag }}-*
          path: tmp/release-assets
          merge-multiple: true
      - name: Generate and validate release evidence
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          python workspace-scripts/generate_release_manifests.py \
            --version "$version" \
            --asset-dir tmp/release-assets \
            --output-dir tmp/release-evidence
          python workspace-scripts/generate_release_evidence.py \
            --version "$version" \
            --release-tag "${{ needs.prepare.outputs.tag }}" \
            --source-revision "$GITHUB_SHA" \
            --asset-inventory tmp/release-evidence/smorg-assets.json \
            --output tmp/release-evidence/smorg-release-evidence.json
          ruby -c tmp/release-evidence/smorg.rb
          python -m json.tool tmp/release-evidence/smorg.json >/dev/null
          python -m json.tool tmp/release-evidence/smorg-release-evidence.json >/dev/null
      - name: Upload assembled release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smorg-${{ needs.prepare.outputs.tag }}-release-evidence
          path: tmp/release-evidence
          if-no-files-found: error

  publish-rust:
    name: Publish Rust dependency closure
    needs: [prepare, check-registries, validate, release-binaries, assemble-release-evidence]
    if: >-
      ${{
        (needs.prepare.outputs.publish_enabled == 'true' ||
          needs.prepare.outputs.dry_run == 'true') &&
        needs.prepare.outputs.release_crates == 'true' &&
        (needs.prepare.outputs.dry_run == 'true' ||
          fromJson(needs.check-registries.outputs.results).cratesio != 'true' ||
          needs.prepare.outputs.force_republish == 'true')
      }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Setup Ruby
        uses: appraisal-rb/setup-ruby-flash@4ee08a66f0a60f7bb129d5d0e997042f935d1904 # v2.5
        with:
          ruby-version: "4.0"
      - name: Publish dependency-first Rust closure and tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            ruby workspace-scripts/release_rust_crates.rb --no-push --tag
          else
            ruby workspace-scripts/release_rust_crates.rb --push --tag
            git push origin "$RELEASE_TAG"
          fi

  verify-rust-install:
    name: Verify crates.io installation
    needs: [prepare, publish-rust]
    if: ${{ needs.prepare.outputs.publish_enabled == 'true' && needs.publish-rust.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install published smorg crate
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p "$RUNNER_TEMP/smorg-install"
          cargo install smorg --version "$version" --locked --root "$RUNNER_TEMP/smorg-install"
          "$RUNNER_TEMP/smorg-install/bin/smorg" --version
          "$RUNNER_TEMP/smorg-install/bin/smorg-rs" --version
      - name: Verify installed CLI discovery contract
        env:
          SMORG_TEST_ARTIFACT: ${{ runner.temp }}/smorg-install/bin/smorg
        run: python -m unittest discover -s workspace-scripts/tests -p '*cli_artifact_manifest.py' -v
