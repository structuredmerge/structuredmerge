[tools]
rust = "stable"
"github:xberg-io/alef" = "0.89.0"

[tasks.format]
run = "cargo fmt --all"

[tasks.format-check]
run = "cargo fmt --all --check"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.typecheck]
run = "cargo check --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.alef-verify]
run = "alef verify --exit-code"

[tasks.ruby-spec]
run = "bundle check || bundle install && bundle exec rake spec"
dir = "packages/ruby"

[tasks.ruby-package]
description = "Export a development typed-core platform gem; never publish"
dir = "packages/ruby"
run = "bundle exec rake compile && bundle exec ruby ../../workspace-scripts/check_core_ruby_artifact.rb --package-only ../../tmp/core-artifacts"

[tasks.publish-validate]
run = "alef publish validate"

[tasks.check]
run = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

[tasks.release]
raw = true
description = "Publish Rust crates; pass release options after --"
run = "ruby workspace-scripts/release_rust_crates.rb"
